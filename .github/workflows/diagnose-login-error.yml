name: Diagnose login error

on:
  push:
    paths:
      - '.github/workflows/diagnose-login-error.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Show real login error code
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('login.html')
          t = p.read_text(encoding='utf-8')
          old = """      } catch (error) {
        console.error('[YMS] 로그인 오류:', error);
        showError('로그인 처리 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
      } finally {"""
          new = """      } catch (error) {
        console.error('[YMS] 로그인 오류:', error);
        const code = String(error?.code || error?.message || 'UNKNOWN_ERROR');
        const friendly = {
          INVALID_LOGIN_CREDENTIALS: '아이디 또는 비밀번호가 Firebase 인증 정보와 일치하지 않습니다.',
          EMAIL_NOT_FOUND: 'Firebase Authentication에 해당 로그인 계정이 없습니다.',
          INVALID_PASSWORD: '비밀번호가 Firebase 인증 정보와 일치하지 않습니다.',
          USER_DISABLED: 'Firebase에서 비활성화된 계정입니다.',
          OPERATION_NOT_ALLOWED: 'Firebase 이메일/비밀번호 로그인이 비활성화되어 있습니다.',
          PROFILE_NOT_FOUND: '로그인 인증은 되었지만 Firestore 사용자 프로필을 찾을 수 없습니다.',
          LOGIN_ID_MISMATCH: 'Firebase 계정과 Firestore 로그인 아이디 정보가 일치하지 않습니다.',
          FIREBASE_CONFIG_MISSING: 'Firebase 설정값을 불러오지 못했습니다.',
          FIREBASE_CONFIG_LOAD_FAILED: 'Firebase 설정 파일을 불러오지 못했습니다.'
        }[code];
        showError((friendly || '로그인 오류') + ' [오류 코드: ' + code + ']');
      } finally {"""
          if old not in t:
              raise SystemExit('login catch block not found')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add login.html
          git commit -m "diag: show Firebase login error code"
          git push origin main
