name: Include book rollover script

on:
  push:
    paths:
      - '.github/workflows/include-book-rollover-script.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Include rollover script in payment page
        run: python -c "from pathlib import Path; p=Path('payment.html'); t=p.read_text(encoding='utf-8'); tag='<script src=\"js/payment-book-rollover.js\"></script>'; assert tag not in t; t=t.replace('</body>', tag+'\n</body>', 1); p.write_text(t, encoding='utf-8')"
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add payment.html
          git commit -m "feat: enable book fee rollover on payment page"
          git push origin main
