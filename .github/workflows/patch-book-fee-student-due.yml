name: Patch book fees by student due day

on:
  push:
    paths:
      - '.github/workflows/patch-book-fee-student-due.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch payment book billing logic
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add payment.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: bill book fees by student due-day cutoff"
          git push origin main
