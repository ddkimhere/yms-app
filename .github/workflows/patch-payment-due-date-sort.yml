name: Patch payment due date sort

on:
  push:
    paths:
      - '.github/workflows/patch-payment-due-date-sort.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Add due date sorting to admin payments
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('admin.html')
          text = path.read_text(encoding='utf-8')

          old = """    else if (adminPayFilter === 'OVERDUE') pays = pays.filter(p=>p.status==='OVERDUE');

    // 이번 달 전체 기준 통계"""

          new = """    else if (adminPayFilter === 'OVERDUE') pays = pays.filter(p=>p.status==='OVERDUE');

    // 납기일 빠른 순으로 정렬 (납기일이 없는 항목은 마지막)
    pays.sort((a, b) => {
      const aDue = a.dueDate || '9999-12-31';
      const bDue = b.dueDate || '9999-12-31';
      return aDue.localeCompare(bDue);
    });

    // 이번 달 전체 기준 통계"""

          if old not in text:
              raise SystemExit('Target payment filter block not found; admin.html was not changed.')

          if "const aDue = a.dueDate || '9999-12-31';" in text:
              raise SystemExit('Due-date sorting is already present; no duplicate patch applied.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: sort admin payments by due date"
          git push origin main
