<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>캘린더 · YMS Master Track</title>
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#E8B84B">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="YMS">
  <link rel="apple-touch-icon" href="images/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <style>
    :root{--navy:#1E3278;--navy-dark:#14245A;--navy-lt:#2A4099;--periwinkle:#7492D5;--periwinkle-lt:#A8BDE8;--periwinkle-bg:#EEF3FB;--sky-bg:#F4F7FD;--warm-white:#fff;--charcoal:#1A2340;--gray-dark:#3D4A6B;--gray-mid:#7A87A8;--gray-light:#BDC6DC;--gray-bg:#EDF0F7;--beige:#E3E8F4;--beige-dark:#C8D1E8;--present:#2E9E6B;--late:#E8A020;--absent:#E04040;--pending:#8A96B2;--mustard:var(--periwinkle);--mustard-lt:var(--periwinkle-lt);--mustard-bg:var(--periwinkle-bg);--orange:var(--navy);--orange-lt:var(--navy-lt);--orange-dark:var(--navy-dark);--cream:var(--sky-bg);--shadow-sm:0 1px 4px rgba(30,50,120,.08);--shadow-md:0 4px 16px rgba(30,50,120,.12);--shadow-lg:0 8px 32px rgba(30,50,120,.16);--radius-sm:8px;--radius-md:16px;--radius-lg:24px;--radius-xl:32px;--radius-full:9999px;--font-kr:'Noto Sans KR',-apple-system,sans-serif;--font-en:'Nunito',sans-serif;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{font-family:var(--font-kr);background:var(--sky-bg);color:var(--charcoal);min-height:100vh;-webkit-font-smoothing:antialiased;}
    .app-wrapper{max-width:430px;min-height:100vh;margin:0 auto;background:var(--sky-bg);position:relative;overflow-x:hidden;}
    /* ── Calendar Grid ── */
    .cal-header {
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 14px 20px 8px;
    }
    .cal-month-label {
      font-size: 20px; font-weight: 800; color: var(--charcoal);
    }
    .cal-nav-btn {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1.5px solid var(--beige-dark);
      background: var(--warm-white); cursor: pointer;
      font-size: 18px; display: flex; align-items: center; justify-content: center;
      color: var(--charcoal); transition: background .15s;
    }
    .cal-nav-btn:hover { background: var(--beige); }

    .cal-dow-row {
      display: grid; grid-template-columns: repeat(7,1fr);
      padding: 0 16px;
    }
    .cal-dow {
      text-align: center; font-size: 11px; font-weight: 700;
      color: var(--gray-mid); padding: 6px 0;
    }
    .cal-dow:first-child { color: var(--absent); }
    .cal-dow:last-child  { color: #1976D2; }

    .cal-grid {
      display: grid; grid-template-columns: repeat(7,1fr);
      padding: 0 16px 12px;
      gap: 2px;
    }
    .cal-cell {
      min-height: 52px; padding: 3px;
      border-radius: var(--radius-sm);
      cursor: default;
      position: relative;
    }
    .cal-cell.has-events { cursor: pointer; }
    .cal-cell:hover.has-events { background: var(--mustard-bg); }

    .cal-date {
      font-size: 13px; font-weight: 700;
      color: var(--charcoal); line-height: 1;
      padding: 2px 4px;
      display: inline-block;
    }
    .cal-date.today {
      background: var(--orange); color: #fff;
      border-radius: 50%;
      width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
    }
    .cal-date.other-month { color: var(--gray-light); }
    .cal-date.sun { color: var(--absent); }
    .cal-date.sat { color: #1976D2; }

    .cal-dots {
      display: flex; gap: 2px; flex-wrap: wrap;
      padding: 2px 2px 0;
    }
    .cal-dot {
      width: 5px; height: 5px; border-radius: 50%;
      flex-shrink: 0;
    }
    .cal-event-label {
      font-size: 8px; font-weight: 700; color: #fff;
      padding: 1px 4px; border-radius: 3px;
      white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis;
      display: block; max-width: 100%;
      margin-top: 1px;
    }

    /* ── Event List (for selected day) ── */
    .event-list-header {
      padding: 12px 20px 6px;
      font-size: 15px; font-weight: 700; color: var(--charcoal);
      border-top: 1px solid var(--beige);
    }
    .event-item {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 10px 20px;
      border-bottom: 1px solid var(--beige);
      cursor: pointer;
    }
    .event-item:last-child { border-bottom: none; }
    .event-color-bar {
      width: 4px; height: 44px; border-radius: 2px;
      flex-shrink: 0;
    }
    .event-info { flex: 1; }
    .event-title { font-size: 14px; font-weight: 600; color: var(--charcoal); }
    .event-time  { font-size: 12px; color: var(--gray-mid); margin-top: 2px; }
    .event-type-badge {
      font-size: 10px; font-weight: 700;
      padding: 2px 8px; border-radius: var(--radius-full);
      white-space: nowrap; flex-shrink: 0;
      align-self: flex-start; margin-top: 2px;
    }

    /* ── Legend ── */
    .legend-row {
      display: flex; flex-wrap: wrap; gap: 10px;
      padding: 10px 20px;
      border-top: 1px solid var(--beige);
    }
    .legend-item {
      display: flex; align-items: center; gap: 4px;
      font-size: 11px; color: var(--gray-dark);
    }
    .legend-dot {
      width: 8px; height: 8px; border-radius: 50%;
    }

    /* Upcoming events in sidebar-style list */
    .upcoming-list { padding: 0 20px; }
    .upcoming-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 0; border-bottom: 1px solid var(--beige);
    }
    .upcoming-item:last-child { border-bottom: none; }
    .upcoming-date {
      width: 40px; text-align: center; flex-shrink: 0;
    }
    .upcoming-date-day { font-size: 18px; font-weight: 800; color: var(--charcoal); }
    .upcoming-date-dow { font-size: 10px; color: var(--gray-mid); }
  </style>
</head>
<body>
<div class="app-wrapper">
  <!-- App Bar -->
  <header class="app-bar">
    <div class="app-bar-left">
      <button class="icon-btn" onclick="history.back()">←</button>
      <span style="font-size:17px;font-weight:700;color:var(--charcoal);">캘린더</span>
    </div>
    <div class="app-bar-right">
      <button class="icon-btn" onclick="goToday()">today</button>
    </div>
  </header>

  <!-- View Toggle -->
  <div style="display:flex;gap:6px;padding:8px 20px 0;">
    <button class="filter-chip active" id="viewMonth" style="padding:6px 14px;border-radius:9999px;border:1.5px solid var(--orange);font-size:12px;font-weight:700;cursor:pointer;background:var(--orange);color:#fff;" onclick="setView('month',this)">월간</button>
    <button class="filter-chip" id="viewWeek" style="padding:6px 14px;border-radius:9999px;border:1.5px solid var(--beige-dark);font-size:12px;font-weight:700;cursor:pointer;background:var(--warm-white);color:var(--gray-mid);" onclick="setView('week',this)">주간</button>
    <button class="filter-chip" id="viewUpcoming" style="padding:6px 14px;border-radius:9999px;border:1.5px solid var(--beige-dark);font-size:12px;font-weight:700;cursor:pointer;background:var(--warm-white);color:var(--gray-mid);" onclick="setView('upcoming',this)">예정</button>
  </div>

  <!-- Calendar Header -->
  <div class="cal-header">
    <button class="cal-nav-btn" onclick="changeMonth(-1)">‹</button>
    <div class="cal-month-label" id="calMonthLabel">-</div>
    <button class="cal-nav-btn" onclick="changeMonth(1)">›</button>
  </div>

  <!-- DOW Headers -->
  <div class="cal-dow-row" id="dowRow">
    <div class="cal-dow">일</div><div class="cal-dow">월</div>
    <div class="cal-dow">화</div><div class="cal-dow">수</div>
    <div class="cal-dow">목</div><div class="cal-dow">금</div>
    <div class="cal-dow">토</div>
  </div>

  <!-- Calendar Grid -->
  <div class="cal-grid" id="calGrid"></div>

  <!-- Legend -->
  <div class="legend-row">
    <div class="legend-item"><div class="legend-dot" style="background:#D4641A;"></div>수업</div>
    <div class="legend-item"><div class="legend-dot" style="background:#E53935;"></div>숙제 마감</div>
    <div class="legend-item"><div class="legend-dot" style="background:#4CAF50;"></div>휴원</div>
    <div class="legend-item"><div class="legend-dot" style="background:#1976D2;"></div>특강/테스트</div>
    <div class="legend-item"><div class="legend-dot" style="background:#7B1FA2;"></div>기타</div>
  </div>

  <!-- Selected Day Events -->
  <div id="selectedDaySection" class="hidden">
    <div class="event-list-header" id="selectedDayLabel">날짜 선택</div>
    <div id="eventList"></div>
  </div>

  <!-- Upcoming Events (list view) -->
  <div id="upcomingSection" class="hidden">
    <div style="padding:12px 20px 6px;font-size:15px;font-weight:700;color:var(--charcoal);">📋 앞으로의 일정</div>
    <div class="upcoming-list" id="upcomingList"></div>
  </div>

  <!-- Padding for tab bar -->
  <div style="height:80px;"></div>

  <!-- Tab Bar -->
  <nav class="tab-bar" id="tabBar"></nav>
</div>

<!-- Event Detail Modal -->
<div id="evDetailModal" class="modal-overlay hidden">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div id="evDetailContent"></div>
    <button class="btn btn-ghost btn-full mt-14" onclick="document.getElementById('evDetailModal').classList.add('hidden')">닫기</button>
  </div>
</div>

<script>(function(){var h=location.href.split('?')[0].split('#')[0],b=h.substring(0,h.lastIndexOf('/')+1);if(!document.querySelector('base')){var e=document.createElement('base');e.href=b;document.head.insertBefore(e,document.head.firstChild);}window._ymsGo=function(p){location.href=b+p;};})()</script>
<script src="js/app.js"></script>
<script>
  const user = ymsPageInit(true);
  let viewMode = 'month';
  let calYear  = new Date().getFullYear();
  let calMonth = new Date().getMonth(); // 0-based
  let selectedDate = null;

  const typeColors = { class:'#D4641A', homework:'#E53935', holiday:'#4CAF50', special:'#1976D2', other:'#7B1FA2' };
  const typeLabels = { class:'수업', homework:'숙제마감', holiday:'휴원', special:'특강/테스트', other:'기타' };
  const dows = ['일','월','화','수','목','금','토'];

  function init() {
    if (!user) return;
    ymsRenderTabBar('calendar.html');
    renderCalendar();
  }

  function getEvents() {
    return YMS_DEMO.calendarEvents;
  }

  function eventsOnDate(dateStr) {
    return getEvents().filter(e => e.date === dateStr);
  }

  // ── Month View ─────────────────────────────────────────────
  function renderCalendar() {
    const months = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
    document.getElementById('calMonthLabel').textContent = `${calYear}년 ${months[calMonth]}`;

    const grid = document.getElementById('calGrid');
    grid.innerHTML = '';

    // First day of month
    const firstDay = new Date(calYear, calMonth, 1).getDay(); // 0=Sun
    const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    const today = new Date();
    const todayStr = today.toISOString().slice(0, 10);

    // Prev month padding
    const prevDays = new Date(calYear, calMonth, 0).getDate();
    for (let i = firstDay - 1; i >= 0; i--) {
      const cell = makeCell(calYear, calMonth - 1, prevDays - i, true);
      grid.appendChild(cell);
    }

    // Current month
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const cell = makeCell(calYear, calMonth, d, false, dateStr, todayStr);
      grid.appendChild(cell);
    }

    // Next month padding to fill 6 rows
    const total = firstDay + daysInMonth;
    const nextCount = (7 - (total % 7)) % 7 + (total <= 35 ? 0 : 0);
    const fillTo = Math.ceil(total / 7) * 7;
    for (let d = 1; d <= fillTo - total; d++) {
      const cell = makeCell(calYear, calMonth + 1, d, true);
      grid.appendChild(cell);
    }
  }

  function makeCell(y, m, d, otherMonth, dateStr, todayStr) {
    const cell = document.createElement('div');
    cell.className = 'cal-cell';

    if (!otherMonth && dateStr) {
      const events = eventsOnDate(dateStr);
      if (events.length > 0) cell.classList.add('has-events');

      const dow = new Date(y, m, d).getDay();
      const isToday = dateStr === todayStr;
      const isSelected = dateStr === selectedDate;

      let dateClass = 'cal-date';
      if (otherMonth) dateClass += ' other-month';
      if (dow === 0) dateClass += ' sun';
      if (dow === 6) dateClass += ' sat';
      if (isToday) dateClass += ' today';

      let bg = '';
      if (isSelected && !isToday) bg = 'style="background:var(--mustard-bg);border-radius:var(--radius-sm);"';

      cell.innerHTML = `<div ${bg}><div class="${dateClass}">${d}</div>
        <div class="cal-dots">
          ${events.slice(0, 3).map(e => `<div class="cal-dot" style="background:${typeColors[e.type]||'#999'};"></div>`).join('')}
        </div>
        ${events.slice(0, 2).map(e => `<div class="cal-event-label" style="background:${typeColors[e.type]||'#999'}">${e.title.slice(0,6)}</div>`).join('')}
      </div>`;

      if (events.length > 0) {
        cell.addEventListener('click', () => selectDay(dateStr, events));
      }
    } else {
      const dow = new Date(y, m, d).getDay();
      cell.innerHTML = `<div class="cal-date other-month">${d}</div>`;
    }

    return cell;
  }

  function selectDay(dateStr, events) {
    selectedDate = dateStr;
    renderCalendar(); // re-render to show selection

    const section = document.getElementById('selectedDaySection');
    section.classList.remove('hidden');

    const d = new Date(dateStr);
    document.getElementById('selectedDayLabel').textContent =
      `${d.getMonth()+1}월 ${d.getDate()}일 (${dows[d.getDay()]}) 일정`;

    const list = document.getElementById('eventList');
    list.innerHTML = '';
    events.forEach(ev => {
      const item = document.createElement('div');
      item.className = 'event-item';
      item.innerHTML = `
        <div class="event-color-bar" style="background:${typeColors[ev.type]||'#999'};"></div>
        <div class="event-info">
          <div class="event-title">${ev.title}</div>
          <div class="event-time">${ev.time}</div>
        </div>
        <span class="event-type-badge" style="background:${typeColors[ev.type]||'#999'};color:#fff;">
          ${typeLabels[ev.type]||ev.type}
        </span>
      `;
      item.addEventListener('click', () => openEventDetail(ev));
      list.appendChild(item);
    });

    // Scroll to day section
    section.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ── Week View ──────────────────────────────────────────────
  function renderWeekView() {
    const grid = document.getElementById('calGrid');
    const dowRow = document.getElementById('dowRow');
    grid.innerHTML = '';
    dowRow.style.display = 'grid';

    const today = new Date(calYear, calMonth, 1);
    // find start of current week
    const startOfWeek = new Date(today);
    startOfWeek.setDate(today.getDate() - today.getDay());

    document.getElementById('calMonthLabel').textContent =
      `${startOfWeek.getMonth()+1}/${startOfWeek.getDate()} – ${new Date(startOfWeek.getTime()+6*86400000).getMonth()+1}/${new Date(startOfWeek.getTime()+6*86400000).getDate()}`;

    for (let i = 0; i < 7; i++) {
      const d = new Date(startOfWeek.getTime() + i * 86400000);
      const dateStr = d.toISOString().slice(0,10);
      const events  = eventsOnDate(dateStr);
      const cell = document.createElement('div');
      cell.className = `cal-cell${events.length ? ' has-events' : ''}`;
      cell.style.minHeight = '80px';
      cell.innerHTML = `
        <div class="cal-date${d.toDateString()===new Date().toDateString()?' today':''}">${d.getDate()}</div>
        ${events.map(e => `
          <div class="cal-event-label" style="background:${typeColors[e.type]};font-size:8px;">${e.title.slice(0,8)}</div>
        `).join('')}
      `;
      if (events.length) cell.addEventListener('click', () => selectDay(dateStr, events));
      grid.appendChild(cell);
    }
  }

  // ── Upcoming View ──────────────────────────────────────────
  function renderUpcomingView() {
    document.getElementById('calGrid').innerHTML = '';
    document.getElementById('dowRow').style.display = 'none';
    document.getElementById('calMonthLabel').textContent = '앞으로의 일정';

    const upList = document.getElementById('upcomingList');
    upList.innerHTML = '';

    const today = new Date().toISOString().slice(0,10);
    const future = getEvents()
      .filter(e => e.date >= today)
      .sort((a,b) => a.date.localeCompare(b.date));

    if (future.length === 0) {
      upList.innerHTML = YMS_UI.renderEmpty('예정된 일정이 없습니다');
      return;
    }

    future.forEach(e => {
      const d = new Date(e.date);
      const item = document.createElement('div');
      item.className = 'upcoming-item';
      item.innerHTML = `
        <div class="upcoming-date">
          <div class="upcoming-date-day">${d.getDate()}</div>
          <div class="upcoming-date-dow">${dows[d.getDay()]}</div>
        </div>
        <div style="width:4px;height:44px;border-radius:2px;background:${typeColors[e.type]||'#999'};flex-shrink:0;"></div>
        <div style="flex:1;">
          <div style="font-size:14px;font-weight:600;color:var(--charcoal);">${e.title}</div>
          <div style="font-size:12px;color:var(--gray-mid);">⏰ ${e.time}</div>
        </div>
        <span class="event-type-badge" style="background:${typeColors[e.type]||'#999'};color:#fff;">${typeLabels[e.type]||e.type}</span>
      `;
      item.addEventListener('click', () => openEventDetail(e));
      upList.appendChild(item);
    });
  }

  // ── Event Detail ───────────────────────────────────────────
  function openEventDetail(ev) {
    const content = document.getElementById('evDetailContent');
    const d = new Date(ev.date);
    content.innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
        <div style="width:44px;height:44px;border-radius:var(--radius-sm);background:${typeColors[ev.type]};display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;flex-shrink:0;">
          ${{class:'🏫',homework:'📖',holiday:'🌸',special:'⭐',other:'📌'}[ev.type]||'📅'}
        </div>
        <div>
          <div style="font-size:18px;font-weight:800;color:var(--charcoal);">${ev.title}</div>
          <span class="event-type-badge" style="background:${typeColors[ev.type]};color:#fff;">${typeLabels[ev.type]}</span>
        </div>
      </div>
      <div style="background:var(--cream);border-radius:var(--radius-md);padding:14px;display:flex;flex-direction:column;gap:8px;">
        <div style="display:flex;gap:8px;font-size:13px;">
          <span style="color:var(--gray-mid);min-width:48px;">날짜</span>
          <strong>${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${dows[d.getDay()]})</strong>
        </div>
        <div style="display:flex;gap:8px;font-size:13px;">
          <span style="color:var(--gray-mid);min-width:48px;">시간</span>
          <strong>${ev.time}</strong>
        </div>
        ${ev.classId ? `<div style="display:flex;gap:8px;font-size:13px;">
          <span style="color:var(--gray-mid);min-width:48px;">반</span>
          <strong>${YMS_DEMO.teacherClasses.find(c=>c.classId===ev.classId)?.className||ev.classId}</strong>
        </div>` : ''}
      </div>
      ${ev.type === 'homework' ? `
        <div style="margin-top:12px;padding:12px;background:var(--mustard-bg);border:1px solid var(--mustard-lt);border-radius:var(--radius-md);">
          <div style="font-size:12px;font-weight:700;color:var(--orange);">📖 숙제 상세</div>
          <div style="font-size:13px;color:var(--gray-dark);margin-top:4px;">숙제 탭에서 상세 내용을 확인하세요.</div>
          <button class="btn btn-secondary btn-sm mt-8" onclick="window.location.href='homework.html'">숙제 보기</button>
        </div>` : ''}
    `;
    document.getElementById('evDetailModal').classList.remove('hidden');
  }

  // ── Controls ───────────────────────────────────────────────
  function changeMonth(dir) {
    calMonth += dir;
    if (calMonth < 0)  { calMonth = 11; calYear--; }
    if (calMonth > 11) { calMonth = 0;  calYear++; }
    selectedDate = null;
    document.getElementById('selectedDaySection').classList.add('hidden');
    renderByView();
  }

  function goToday() {
    calYear  = new Date().getFullYear();
    calMonth = new Date().getMonth();
    selectedDate = null;
    document.getElementById('selectedDaySection').classList.add('hidden');
    renderByView();
  }

  function setView(mode, el) {
    viewMode = mode;
    [document.getElementById('viewMonth'), document.getElementById('viewWeek'), document.getElementById('viewUpcoming')].forEach(b => {
      b.style.background = 'var(--warm-white)'; b.style.color = 'var(--gray-mid)'; b.style.borderColor = 'var(--beige-dark)';
    });
    el.style.background = 'var(--orange)'; el.style.color = '#fff'; el.style.borderColor = 'var(--orange)';

    document.getElementById('selectedDaySection').classList.add('hidden');
    document.getElementById('upcomingSection').classList.toggle('hidden', mode !== 'upcoming');
    document.getElementById('calGrid').style.display = mode === 'upcoming' ? 'none' : 'grid';
    document.getElementById('dowRow').style.display  = mode === 'upcoming' ? 'none' : 'grid';

    renderByView();
  }

  function renderByView() {
    if (viewMode === 'month')    renderCalendar();
    else if (viewMode === 'week') renderWeekView();
    else                         renderUpcomingView();
  }

  document.getElementById('evDetailModal').addEventListener('click', function(e) {
    if (e.target === this) this.classList.add('hidden');
  });

  init();
</script>
</body>
</html>
