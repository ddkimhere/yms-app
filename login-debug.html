<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YMS 로그인 진단</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fd;margin:0;color:#1a2340}.wrap{max-width:440px;margin:60px auto;padding:20px}.card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 16px 40px rgba(30,50,120,.12)}h1{font-size:22px;margin:0 0 8px}.desc{font-size:13px;color:#7a87a8;margin-bottom:20px}label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px}input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #dce3f2;border-radius:12px;font-size:15px}button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:#2841ae;color:#fff;font-size:15px;font-weight:800}.result{margin-top:18px;padding:14px;border-radius:12px;background:#f7f8fb;white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.55}.ok{background:#eef9f2;color:#17663d}.err{background:#fff3f3;color:#b83232}.note{margin-top:14px;font-size:11px;color:#8d98b1;line-height:1.5}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>YMS 로그인 진단</h1>
<div class="desc">Firebase Authentication과 현재 UID의 Firestore 사용자 문서 상태를 읽기 전용으로 확인합니다.</div>
<form id="f">
<label for="id">아이디</label><input id="id" autocomplete="username" required>
<label for="pw">비밀번호</label><input id="pw" type="password" autocomplete="current-password" required>
<button type="submit">진단하기</button>
</form>
<div id="r" class="result">아직 진단하지 않았습니다.</div>
<div class="note">읽기 전용 진단입니다. 학생·반·납부·계정 데이터를 생성하거나 수정하거나 삭제하지 않습니다.</div>
</div></div>
<script src="js/firebase-config.js"></script>
<script>
const f=document.getElementById('f'),r=document.getElementById('r');
const norm=v=>String(v||'').trim().toLowerCase();
const emailFor=id=>`${norm(id).replace(/[^a-z0-9._-]/g,'')}@yms.local`;
f.addEventListener('submit',async e=>{
 e.preventDefault(); r.className='result'; r.textContent='확인 중...';
 const id=document.getElementById('id').value.trim(),pw=document.getElementById('pw').value;
 try{
   const cfg=window.YMS_FIREBASE_CONFIG;
   if(!cfg?.apiKey||!cfg?.projectId) throw new Error('FIREBASE_CONFIG_MISSING');
   const ar=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${encodeURIComponent(cfg.apiKey)}`,{
     method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:emailFor(id),password:pw,returnSecureToken:true})
   });
   const aj=await ar.json().catch(()=>({}));
   if(!ar.ok){
     const code=aj?.error?.message||`AUTH_HTTP_${ar.status}`;
     r.className='result err';
     r.textContent='Firebase 인증 실패\n오류 코드: '+code;
     return;
   }
   const uid=aj.localId;
   const url=`https://firestore.googleapis.com/v1/projects/${encodeURIComponent(cfg.projectId)}/databases/(default)/documents/users/${encodeURIComponent(uid)}`;
   const pr=await fetch(url,{headers:{Authorization:`Bearer ${aj.idToken}`}});
   let result='Firebase 인증 성공\n인증 UID: '+uid+'\nFirestore users/'+uid+' 조회 HTTP 상태: '+pr.status;
   if(pr.ok){
     const pj=await pr.json().catch(()=>({}));
     const fields=pj?.fields||{};
     const role=fields.role?.stringValue||'-';
     const loginId=fields.loginId?.stringValue||'-';
     result+='\n프로필 존재: 예\nrole: '+role+'\nloginId: '+loginId;
     r.className='result ok';
   }else{
     const text=await pr.text().catch(()=> '');
     let statusMeaning=pr.status===404?'현재 UID에 해당하는 users 문서가 없음':pr.status===403?'Firestore 보안 규칙이 조회를 거부함':'기타 Firestore 조회 오류';
     result+='\n프로필 존재/접근: 실패\n판정: '+statusMeaning;
     try{const j=JSON.parse(text);if(j?.error?.status)result+='\nFirestore 오류: '+j.error.status;}catch(_e){}
     r.className='result err';
   }
   r.textContent=result;
 }catch(err){
   r.className='result err';
   r.textContent='진단 오류\n'+String(err?.message||err||'UNKNOWN_ERROR');
 }
});
</script>
</body>
</html>
