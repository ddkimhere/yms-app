<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YMS 로그인 진단</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fd;margin:0;color:#1a2340}.wrap{max-width:440px;margin:60px auto;padding:20px}.card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 16px 40px rgba(30,50,120,.12)}h1{font-size:22px;margin:0 0 8px}.desc{font-size:13px;color:#7a87a8;margin-bottom:20px}label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px}input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #dce3f2;border-radius:12px;font-size:15px}button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:#2841ae;color:#fff;font-size:15px;font-weight:800}.result{margin-top:18px;padding:14px;border-radius:12px;background:#f7f8fb;white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.55}.ok{background:#eef9f2;color:#17663d}.err{background:#fff3f3;color:#b83232}.note{margin-top:14px;font-size:11px;color:#8d98b1;line-height:1.5}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>YMS 로그인 진단</h1>
<div class="desc">Firebase 인증 단계와 Firestore 사용자 프로필 조회 단계만 확인합니다.</div>
<form id="f">
<label for="id">아이디</label><input id="id" autocomplete="username" required>
<label for="pw">비밀번호</label><input id="pw" type="password" autocomplete="current-password" required>
<button type="submit">진단하기</button>
</form>
<div id="r" class="result">아직 진단하지 않았습니다.</div>
<div class="note">이 페이지는 학생·반·납부 데이터를 생성하거나 수정하거나 삭제하지 않습니다.</div>
</div></div>
<script>window._YMS_BASE='./';</script>
<script src="js/app.js"></script>
<script>
const f=document.getElementById('f'),r=document.getElementById('r');
f.addEventListener('submit',async e=>{
 e.preventDefault(); r.className='result'; r.textContent='확인 중...';
 const id=document.getElementById('id').value.trim(),pw=document.getElementById('pw').value;
 try{
   if(!window.YMS_Auth?.loginWithTable) throw Object.assign(new Error('AUTH_API_NOT_READY'),{code:'AUTH_API_NOT_READY'});
   const out=await window.YMS_Auth.loginWithTable(id,pw);
   const u=out?.user||{};
   r.className='result ok';
   r.textContent='인증 성공\n오류 없음\n역할: '+(u.role||'-')+'\n프로필 ID: '+(u.id||u.uid||'-');
 }catch(err){
   const code=String(err?.code||err?.message||'UNKNOWN_ERROR');
   r.className='result err';
   r.textContent='로그인 실패\n오류 코드: '+code+'\n메시지: '+String(err?.message||'');
 }
});
</script>
</body>
</html>
