<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>로그인 · YMS Master Track</title>
  <meta name="theme-color" content="#1E3278">
  <style>
    :root {
      --navy: #1E3278;
      --navy-dark: #14245A;
      --navy-light: #2A4099;
      --bg: #F4F7FD;
      --card: #FFFFFF;
      --text: #1A2340;
      --muted: #7A87A8;
      --line: #DCE3F2;
      --danger: #D64545;
      --shadow: 0 18px 50px rgba(30, 50, 120, .14);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at 15% 10%, rgba(116,146,213,.18), transparent 28%),
        radial-gradient(circle at 90% 85%, rgba(30,50,120,.10), transparent 30%),
        var(--bg);
    }

    .login-shell {
      width: min(100%, 420px);
    }

    .brand {
      text-align: center;
      margin-bottom: 22px;
    }

    .brand-mark {
      width: 74px;
      height: 74px;
      margin: 0 auto 14px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, var(--navy-dark), var(--navy-light));
      color: #fff;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -1px;
      box-shadow: 0 10px 24px rgba(30,50,120,.26);
    }

    .brand h1 {
      margin: 0;
      font-size: 26px;
      letter-spacing: -.6px;
      color: var(--navy-dark);
    }

    .brand p {
      margin: 7px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .login-card {
      background: var(--card);
      border: 1px solid rgba(220,227,242,.9);
      border-radius: 24px;
      padding: 28px;
      box-shadow: var(--shadow);
    }

    .login-card h2 {
      margin: 0 0 6px;
      font-size: 20px;
      font-weight: 800;
    }

    .login-card .desc {
      margin: 0 0 24px;
      font-size: 13px;
      line-height: 1.6;
      color: var(--muted);
    }

    .field {
      margin-bottom: 17px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 700;
      color: #34405F;
    }

    .input-wrap {
      position: relative;
    }

    input {
      width: 100%;
      height: 50px;
      padding: 0 15px;
      border: 1.5px solid var(--line);
      border-radius: 13px;
      outline: none;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-size: 15px;
      transition: border-color .15s, box-shadow .15s;
    }

    input:focus {
      border-color: #7492D5;
      box-shadow: 0 0 0 4px rgba(116,146,213,.12);
    }

    #password {
      padding-right: 48px;
    }

    .pw-toggle {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 17px;
    }

    .pw-toggle:hover {
      background: #F2F5FB;
    }

    .error {
      display: none;
      margin: -4px 0 16px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #FFF1F1;
      color: var(--danger);
      font-size: 12px;
      line-height: 1.5;
    }

    .error.show { display: block; }

    .login-btn {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 13px;
      background: linear-gradient(135deg, var(--navy), var(--navy-light));
      color: #fff;
      font: inherit;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(30,50,120,.20);
      transition: transform .12s, opacity .12s;
    }

    .login-btn:hover { transform: translateY(-1px); }
    .login-btn:disabled { cursor: default; opacity: .65; transform: none; }

    .spinner {
      width: 19px;
      height: 19px;
      margin: 0 auto;
      border: 2px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .account-note {
      margin-top: 16px;
      text-align: center;
      font-size: 11px;
      line-height: 1.6;
      color: #98A3BC;
    }

    @media (max-width: 520px) {
      body { padding: 18px; align-items: flex-start; padding-top: 54px; }
      .login-card { padding: 24px 20px; border-radius: 20px; }
      .brand-mark { width: 68px; height: 68px; border-radius: 21px; }
      .brand h1 { font-size: 23px; }
    }
  </style>
</head>
<body>
  <main class="login-shell">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">YMS</div>
      <h1>YMS Master Track</h1>
      <p>학생 · 선생님 · 관리자 통합 관리</p>
    </div>

    <section class="login-card" aria-labelledby="loginTitle">
      <h2 id="loginTitle">로그인</h2>
      <p class="desc">관리자가 발급한 아이디와 비밀번호를 입력해주세요.</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="loginId">아이디</label>
          <input
            id="loginId"
            name="loginId"
            type="text"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            placeholder="아이디"
            required
          >
        </div>

        <div class="field">
          <label for="password">비밀번호</label>
          <div class="input-wrap">
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="비밀번호"
              required
            >
            <button class="pw-toggle" id="pwToggle" type="button" aria-label="비밀번호 보기">👁</button>
          </div>
        </div>

        <div class="error" id="loginError" role="alert"></div>

        <button class="login-btn" id="loginBtn" type="submit">
          <span id="loginBtnText">로그인</span>
        </button>
      </form>

      <div class="account-note">계정 생성 및 비밀번호 변경은 관리자에게 문의해주세요.</div>
    </section>
  </main>

  <script>
    (function setBasePath() {
      const cleanUrl = window.location.href.split('?')[0].split('#')[0];
      const base = cleanUrl.substring(0, cleanUrl.lastIndexOf('/') + 1);
      window._YMS_BASE = base;
      window._ymsGo = function (path) {
        window.location.href = base + path;
      };
    })();
  </script>

  <!-- 기존 YMS 계정 데이터 연결. 현재 저장소에서 이 파일은 복구가 필요함. -->
  <script src="js/app.js"></script>

  <script>
    const ROLE_HOME = Object.freeze({
      ADMIN: 'admin.html',
      TEACHER: 'teacher-home.html',
      STUDENT: 'student-home.html'
    });

    const form = document.getElementById('loginForm');
    const loginIdEl = document.getElementById('loginId');
    const passwordEl = document.getElementById('password');
    const errorEl = document.getElementById('loginError');
    const loginBtn = document.getElementById('loginBtn');
    const loginBtnText = document.getElementById('loginBtnText');
    const pwToggle = document.getElementById('pwToggle');

    function showError(message) {
      errorEl.textContent = message;
      errorEl.classList.add('show');
    }

    function clearError() {
      errorEl.textContent = '';
      errorEl.classList.remove('show');
    }

    function setLoading(loading) {
      loginBtn.disabled = loading;
      loginBtnText.innerHTML = loading ? '<div class="spinner" aria-label="로그인 중"></div>' : '로그인';
    }

    pwToggle.addEventListener('click', function () {
      const isHidden = passwordEl.type === 'password';
      passwordEl.type = isHidden ? 'text' : 'password';
      pwToggle.textContent = isHidden ? '🙈' : '👁';
      pwToggle.setAttribute('aria-label', isHidden ? '비밀번호 숨기기' : '비밀번호 보기');
    });

    form.addEventListener('submit', async function (event) {
      event.preventDefault();
      clearError();

      const loginId = loginIdEl.value.trim();
      const password = passwordEl.value;

      if (!loginId || !password) {
        showError('아이디와 비밀번호를 모두 입력해주세요.');
        return;
      }

      if (!window.YMS_Auth || typeof window.YMS_Auth.loginWithTable !== 'function') {
        showError('계정 인증 연결이 준비되지 않았습니다. 관리자 설정을 확인해주세요.');
        return;
      }

      setLoading(true);

      try {
        const userData = await window.YMS_Auth.loginWithTable(loginId, password);

        if (!userData || !userData.user) {
          showError('아이디 또는 비밀번호를 확인해주세요.');
          return;
        }

        const role = String(userData.user.role || '').toUpperCase();
        const target = ROLE_HOME[role];

        if (!target) {
          showError('이 계정에는 현재 YMS 앱 사용 권한이 없습니다.');
          return;
        }

        if (typeof window.YMS_Auth.save !== 'function') {
          throw new Error('AUTH_SAVE_NOT_AVAILABLE');
        }

        window.YMS_Auth.save(userData.token, userData.user);
        window._ymsGo(target);
      } catch (error) {
        console.error('[YMS] 로그인 오류:', error);
        showError('로그인 처리 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
