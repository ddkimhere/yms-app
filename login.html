<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>로그인 · YMS Master Track</title>
  <meta name="theme-color" content="#1E3278">
  <style>
    :root {
      --navy: #1E3278;
      --navy-dark: #14245A;
      --navy-light: #334DB8;
      --periwinkle: #7492D5;
      --bg: #F4F7FD;
      --card: #FFFFFF;
      --text: #1A2340;
      --muted: #7A87A8;
      --line: #DCE3F2;
      --danger: #D64545;
      --danger-bg: #FFF3F3;
      --shadow: 0 22px 55px rgba(30, 50, 120, .15);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
    }

    .page {
      min-height: 100vh;
      background:
        radial-gradient(circle at 10% 86%, rgba(116,146,213,.12), transparent 28%),
        radial-gradient(circle at 92% 82%, rgba(30,50,120,.08), transparent 30%),
        var(--bg);
      overflow: hidden;
    }

    .hero {
      min-height: 300px;
      padding: 74px 24px 94px;
      position: relative;
      overflow: hidden;
      text-align: center;
      background: linear-gradient(145deg, #14245A 0%, #1E3278 48%, #344EC4 100%);
    }

    .hero::before,
    .hero::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .hero::before {
      width: 280px;
      height: 280px;
      top: -120px;
      left: -110px;
      background: rgba(255,255,255,.07);
    }

    .hero::after {
      width: 230px;
      height: 230px;
      right: -90px;
      bottom: -105px;
      border: 52px solid rgba(116,146,213,.12);
    }

    .hero-inner {
      position: relative;
      z-index: 1;
      max-width: 430px;
      margin: 0 auto;
    }

    .hero h1 {
      margin: 0;
      color: #fff;
      font-size: clamp(30px, 7vw, 40px);
      font-weight: 900;
      line-height: 1.12;
      letter-spacing: -1.2px;
    }

    .hero p {
      margin: 14px 0 0;
      color: rgba(255,255,255,.75);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: -.1px;
    }

    .content {
      width: min(100% - 32px, 430px);
      margin: -64px auto 0;
      position: relative;
      z-index: 2;
      padding-bottom: 36px;
    }

    .login-card {
      background: rgba(255,255,255,.98);
      border: 1px solid rgba(220,227,242,.85);
      border-radius: 26px;
      padding: 30px 26px 26px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .login-card h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 850;
      letter-spacing: -.5px;
    }

    .login-card .desc {
      margin: 7px 0 25px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      color: #34405F;
      font-size: 13px;
      font-weight: 750;
    }

    .input-wrap {
      position: relative;
    }

    input {
      width: 100%;
      height: 54px;
      padding: 0 16px;
      border: 1.5px solid var(--line);
      border-radius: 14px;
      outline: none;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-size: 15px;
      transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
    }

    input::placeholder {
      color: #A5AEC3;
    }

    input:hover {
      border-color: #C5D0E7;
    }

    input:focus {
      border-color: var(--periwinkle);
      box-shadow: 0 0 0 4px rgba(116,146,213,.13);
      background: #fff;
    }

    #password {
      padding-right: 52px;
    }

    .pw-toggle {
      position: absolute;
      right: 9px;
      top: 50%;
      transform: translateY(-50%);
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 11px;
      display: grid;
      place-items: center;
      background: transparent;
      color: #657290;
      cursor: pointer;
      font-size: 17px;
      transition: background .15s ease;
    }

    .pw-toggle:hover {
      background: #F2F5FB;
    }

    .error {
      display: none;
      margin: -2px 0 18px;
      padding: 12px 14px;
      border: 1px solid #FFD5D5;
      border-radius: 12px;
      background: var(--danger-bg);
      color: var(--danger);
      font-size: 12px;
      line-height: 1.55;
    }

    .error.show { display: block; }

    .login-btn {
      width: 100%;
      height: 55px;
      margin-top: 3px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, #2841AE, #4962E0);
      color: #fff;
      font: inherit;
      font-size: 16px;
      font-weight: 850;
      letter-spacing: -.2px;
      cursor: pointer;
      box-shadow: 0 10px 22px rgba(42,64,173,.23);
      transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
    }

    .login-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 13px 26px rgba(42,64,173,.27);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .login-btn:disabled {
      cursor: default;
      opacity: .65;
      transform: none;
    }

    .spinner {
      width: 20px;
      height: 20px;
      margin: 0 auto;
      border: 2px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .account-note {
      margin-top: 18px;
      padding-top: 17px;
      border-top: 1px solid #EEF1F7;
      text-align: center;
      color: #8D98B1;
      font-size: 11px;
      line-height: 1.65;
    }

    .footer {
      padding: 22px 0 2px;
      text-align: center;
      color: #A2ABC0;
      font-size: 11px;
    }

    @media (min-width: 760px) {
      .page {
        padding-bottom: 40px;
      }

      .hero {
        min-height: 330px;
        padding-top: 86px;
      }

      .content {
        width: min(100% - 40px, 440px);
      }
    }

    @media (max-width: 420px) {
      .hero {
        min-height: 276px;
        padding: 62px 20px 86px;
      }

      .hero p {
        font-size: 13px;
      }

      .content {
        width: calc(100% - 28px);
        margin-top: -58px;
      }

      .login-card {
        padding: 26px 20px 22px;
        border-radius: 22px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="hero">
      <div class="hero-inner">
        <h1>YMS Master Track</h1>
        <p>학생 · 선생님 · 관리자 통합 관리</p>
      </div>
    </header>

    <main class="content">
      <section class="login-card" aria-labelledby="loginTitle">
        <h2 id="loginTitle">로그인</h2>
        <p class="desc">관리자가 발급한 아이디와 비밀번호를 입력해주세요.</p>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="loginId">아이디</label>
            <input
              id="loginId"
              name="loginId"
              type="text"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              placeholder="아이디를 입력하세요"
              required
            >
          </div>

          <div class="field">
            <label for="password">비밀번호</label>
            <div class="input-wrap">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="비밀번호를 입력하세요"
                required
              >
              <button class="pw-toggle" id="pwToggle" type="button" aria-label="비밀번호 보기">👁</button>
            </div>
          </div>

          <div class="error" id="loginError" role="alert"></div>

          <button class="login-btn" id="loginBtn" type="submit">
            <span id="loginBtnText">로그인</span>
          </button>
        </form>

        <div class="account-note">계정 생성 및 비밀번호 변경은 관리자에게 문의해주세요.</div>
      </section>

      <div class="footer">YMS Master Track</div>
    </main>
  </div>

  <script>
    (function setBasePath() {
      const cleanUrl = window.location.href.split('?')[0].split('#')[0];
      const base = cleanUrl.substring(0, cleanUrl.lastIndexOf('/') + 1);
      window._YMS_BASE = base;
      window._ymsGo = function (path) {
        window.location.href = base + path;
      };
    })();
  </script>

  <script src="js/app.js"></script>

  <script>
    const ROLE_HOME = Object.freeze({
      ADMIN: 'admin.html',
      TEACHER: 'teacher-home.html',
      STUDENT: 'student-home.html'
    });

    const form = document.getElementById('loginForm');
    const loginIdEl = document.getElementById('loginId');
    const passwordEl = document.getElementById('password');
    const errorEl = document.getElementById('loginError');
    const loginBtn = document.getElementById('loginBtn');
    const loginBtnText = document.getElementById('loginBtnText');
    const pwToggle = document.getElementById('pwToggle');

    function showError(message) {
      errorEl.textContent = message;
      errorEl.classList.add('show');
    }

    function clearError() {
      errorEl.textContent = '';
      errorEl.classList.remove('show');
    }

    function setLoading(loading) {
      loginBtn.disabled = loading;
      loginBtnText.innerHTML = loading ? '<div class="spinner" aria-label="로그인 중"></div>' : '로그인';
    }

    pwToggle.addEventListener('click', function () {
      const isHidden = passwordEl.type === 'password';
      passwordEl.type = isHidden ? 'text' : 'password';
      pwToggle.textContent = isHidden ? '🙈' : '👁';
      pwToggle.setAttribute('aria-label', isHidden ? '비밀번호 숨기기' : '비밀번호 보기');
    });

    form.addEventListener('submit', async function (event) {
      event.preventDefault();
      clearError();

      const loginId = loginIdEl.value.trim();
      const password = passwordEl.value;

      if (!loginId || !password) {
        showError('아이디와 비밀번호를 모두 입력해주세요.');
        return;
      }

      if (!window.YMS_Auth || typeof window.YMS_Auth.loginWithTable !== 'function') {
        showError('계정 인증 연결이 준비되지 않았습니다. 관리자 설정을 확인해주세요.');
        return;
      }

      setLoading(true);

      try {
        const userData = await window.YMS_Auth.loginWithTable(loginId, password);

        if (!userData || !userData.user) {
          showError('아이디 또는 비밀번호를 확인해주세요.');
          return;
        }

        const role = String(userData.user.role || '').toUpperCase();
        const target = ROLE_HOME[role];

        if (!target) {
          showError('이 계정에는 현재 YMS 앱 사용 권한이 없습니다.');
          return;
        }

        if (typeof window.YMS_Auth.save !== 'function') {
          throw new Error('AUTH_SAVE_NOT_AVAILABLE');
        }

        window.YMS_Auth.save(userData.token, userData.user);
        window._ymsGo(target);
      } catch (error) {
        console.error('[YMS] 로그인 오류:', error);
        showError('로그인 처리 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
