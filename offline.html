<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>오프라인 · YMS Master Track</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#E8B84B">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #FAF6EF;
      min-height: 100dvh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 32px 24px;
      text-align: center;
    }
    .icon-wrap {
      width: 96px; height: 96px;
      background: #FFF8E7;
      border-radius: 28px;
      display: flex; align-items: center; justify-content: center;
      font-size: 48px;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(232,184,75,.25);
    }
    h1 {
      font-size: 22px; font-weight: 900;
      color: #2D2D2D; margin-bottom: 10px;
    }
    p {
      font-size: 14px; color: #7A7A7A;
      line-height: 1.7; margin-bottom: 32px;
    }
    .btn {
      display: inline-block;
      padding: 14px 32px;
      background: #E8B84B;
      color: #fff;
      border: none;
      border-radius: 50px;
      font-size: 15px; font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(232,184,75,.4);
      transition: transform .15s, box-shadow .15s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(232,184,75,.5); }
    .brand {
      margin-top: 40px;
      font-size: 12px; color: #BFBFBF;
      font-family: 'Nunito', sans-serif; font-weight: 700;
      letter-spacing: .5px;
    }
  </style>
</head>
<body>
  <div class="icon-wrap">📶</div>
  <h1>인터넷 연결을 확인해 주세요</h1>
  <p>
    현재 오프라인 상태입니다.<br>
    Wi-Fi 또는 모바일 데이터를 켜고<br>
    다시 시도해 주세요.
  </p>
  <button class="btn" onclick="location.reload()">🔄 다시 시도</button>
  <div class="brand">YMS Master Track</div>
</body>
</html>
