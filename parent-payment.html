<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>수강료 · YMS Master Track</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="css/style.css">
<style>
body{margin:0;background:#F4F7FD;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Segoe UI",sans-serif;color:#1A2340;padding-bottom:88px}.wrap{max-width:560px;margin:0 auto;min-height:100vh}.top{height:68px;display:flex;align-items:center;gap:12px;padding:0 18px;background:#fff;border-bottom:1px solid #E3E8F4;position:sticky;top:0;z-index:20}.back{border:0;background:#EEF3FB;width:40px;height:40px;border-radius:12px;font-size:18px}.title{font-size:18px;font-weight:900;color:#14245A}.content{padding:18px 16px}.childs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.chip{border:1px solid #D7E0F1;background:#fff;padding:8px 13px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}.chip.active{background:#1E3278;color:#fff;border-color:#1E3278}.card{background:#fff;border:1px solid #E3E8F4;border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:0 5px 18px rgba(30,50,120,.06)}.month{font-size:12px;color:#7492D5;font-weight:800}.name{font-size:20px;font-weight:900;color:#14245A;margin-top:4px}.row{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid #EEF1F7;font-size:13px}.row:last-child{border-bottom:0}.label{color:#7A87A8}.value{font-weight:800;text-align:right}.total{font-size:20px;color:#1E3278}.status{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}.PAID{background:#E8F5EF;color:#2E9E6B}.UNPAID{background:#FFF4E0;color:#C47C00}.OVERDUE{background:#FFEBEB;color:#E04040}.bookbox{margin:14px 0 2px;padding:14px;border-radius:15px;background:#FAFBFE;border:1px solid #E3E8F4}.booktitle{font-size:12px;font-weight:900;color:#1E3278;margin-bottom:6px}.bookrow{display:flex;justify-content:space-between;gap:14px;padding:7px 0;font-size:12px;border-bottom:1px solid #EEF1F7}.bookrow:last-child{border-bottom:0}.bookname{font-weight:750;color:#33405E}.bookamt{font-weight:900;color:#14245A;white-space:nowrap}.grand{margin-top:14px;padding:14px;border-radius:15px;background:#EAF0FF;display:flex;justify-content:space-between;align-items:center}.grand span{font-size:12px;font-weight:800;color:#5D6B8B}.grand strong{font-size:22px;color:#1E3278}.paybox{margin-top:14px;padding:14px;border-radius:14px;background:#EEF3FB}.acct{font-size:17px;font-weight:900;color:#14245A;margin-top:5px}.muted{font-size:11px;color:#7A87A8;margin-top:5px}.qr{display:block!important;width:190px!important;height:190px!important;margin:14px auto 4px!important;background:#fff!important;padding:8px!important;border-radius:14px!important;object-fit:contain!important}.empty{text-align:center;padding:45px 16px;color:#8A96B2}.tab-bar{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,560px);height:70px;padding:7px 8px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.98);border-top:1px solid #E3E8F4;z-index:100}.parent-tab{border:0;background:transparent;color:#8A96B2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:18px;font-weight:700}.parent-tab small{font-size:9px}.parent-tab.active{color:#1E3278}
</style></head><body><div class="wrap"><div class="top"><button class="back" onclick="history.back()">←</button><div class="title">💳 수강료</div></div><main class="content"><div id="childs" class="childs"></div><div id="paymentArea"><div class="empty">수강료 정보를 불러오는 중...</div></div></main><nav class="tab-bar"><button class="parent-tab" onclick="location.href='parent-home.html'"><span>⌂</span><small>홈</small></button><button class="parent-tab" onclick="location.href='homework.html'"><span>▣</span><small>숙제</small></button><button class="parent-tab" onclick="location.href='notices.html'"><span>●</span><small>공지</small></button><button class="parent-tab active"><span>💳</span><small>수강료</small></button><button class="parent-tab" onclick="location.href='counseling.html'"><span>💬</span><small>상담</small></button></nav></div><script src="js/app.js"></script><script>
const user=ymsPageInit(true);let students=[],selected=null,pays=[],bookFees=[];const CASH={bank:'카카오뱅크',account:'3333-36-6373135',holder:'김소라'},OTHER={bank:'카카오뱅크',account:'7942-28-56906',holder:'황유진'};const money=n=>Number(n||0).toLocaleString('ko-KR')+'원';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const feeMonth=f=>String(f.billingMonth||f.month||f.registeredAt||'').slice(0,7);
async function init(){if(!user)return;const ids=Array.isArray(user.childIds)?user.childIds:String(user.childIds||'').split(',').map(x=>x.trim()).filter(Boolean);for(const id of ids){const r=await _tFetch('tables/students/'+encodeURIComponent(id));if(r.ok)students.push(await r.json())}renderChips();if(students.length){selected=students[0];await loadPay();render()}else paymentArea.innerHTML='<div class="empty">연결된 자녀가 없습니다.</div>'}
function renderChips(){childs.innerHTML=students.map((s,i)=>`<button class="chip ${i===0?'active':''}" data-i="${i}">${esc(s.name)}</button>`).join('');[...childs.children].forEach(b=>b.onclick=async()=>{[...childs.children].forEach(x=>x.classList.remove('active'));b.classList.add('active');selected=students[Number(b.dataset.i)];await loadPay();render()})}
async function loadPay(){pays=[];bookFees=[];const r=await _tFetch('tables/payments?limit=500',{cache:'no-store'});if(r.ok){const j=await r.json();pays=(j.data||[]).filter(p=>p.studentId===selected.id).sort((a,b)=>String(b.month||'').localeCompare(String(a.month||'')))}try{bookFees=await window.YMS_ParentPayments?.queryBookFees?.(selected.id)||[]}catch(e){console.warn('[YMS] parent book fees',e);bookFees=[]}}
function render(){const months=[...pays.map(p=>String(p.month||'')),...bookFees.map(f=>feeMonth(f))].filter(Boolean).sort().reverse();if(!months.length){paymentArea.innerHTML='<div class="empty">등록된 수강료 또는 교재비가 없습니다.</div>';return}const targetMonth=months[0],p=pays.find(x=>String(x.month||'')===targetMonth)||null,fees=bookFees.filter(f=>feeMonth(f)===targetMonth&&String(f.status||'REGISTERED')!=='PAID'),bookTotal=fees.reduce((s,f)=>s+Number(f.amount||0),0),base=Number(p?.baseAmount??p?.amount??0),disc=Number(p?.discountAmount||0),tuition=Number(p?.amount||0),type=p?.guideType||(p?.payMethod==='CASH'?'CASH':'OTHER'),acct=type==='CASH'?CASH:OTHER,status=p?.status||'UNPAID',statusText={PAID:'납부완료',UNPAID:'미납',OVERDUE:'연체'}[status]||status,tuitionDue=p&&status==='PAID'?0:tuition,grand=tuitionDue+bookTotal;const payGuide=grand>0?`<div class="paybox"><div style="font-size:12px;font-weight:800;color:#1E3278">${type==='CASH'?'현금결제 계좌':'결제 안내'}</div><div class="acct">${acct.bank} ${acct.account}</div><div class="muted">예금주 ${acct.holder}</div>${type==='CASH'?'':`<img class="qr" src="images/dairoom-pay-qr.svg?v=3.42.0" alt="익산 다이로움 결제 QR"><div class="muted" style="text-align:center;font-weight:700;color:#1E3278">익산 다이로움 QR 결제</div><div class="muted" style="text-align:center">계좌이체 또는 익산 다이로움 QR로 결제할 수 있습니다.</div>`}</div>`:'';paymentArea.innerHTML=`<div class="card"><div class="month">${esc(targetMonth)} 교육비</div><div class="name">${esc(selected.name)} 학생</div>${p?`<div class="row"><span class="label">기본 교육비</span><span class="value">${money(base)}</span></div><div class="row"><span class="label">할인 사유</span><span class="value">${disc?esc(p.discountReason||'-'):'없음'}</span></div><div class="row"><span class="label">할인 금액</span><span class="value">${disc?'- '+money(disc):'0원'}</span></div><div class="row"><span class="label">수강료</span><span class="value total">${money(tuition)}</span></div><div class="row"><span class="label">수강료 상태</span><span class="status ${status}">${statusText}</span></div>`:'<div class="row"><span class="label">수강료</span><span class="value">등록 내역 없음</span></div>'}${fees.length?`<div class="bookbox"><div class="booktitle">📘 교재비</div>${fees.map(f=>`<div class="bookrow"><span class="bookname">${esc(f.bookName||'교재')}</span><span class="bookamt">${money(f.amount)}</span></div>`).join('')}</div>`:''}<div class="grand"><span>총 납부 예정액</span><strong>${money(grand)}</strong></div>${p?.dueDate?`<div class="row"><span class="label">납부 기한</span><span class="value">${esc(p.dueDate)}</span></div>`:''}${payGuide}</div>`}
init();
</script></body></html>
