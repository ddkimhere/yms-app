<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>학생 홈 · YMS Master Track</title>
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#E8B84B">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="YMS">
  <link rel="apple-touch-icon" href="images/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <style>
    :root{--navy:#1E3278;--navy-dark:#14245A;--navy-lt:#2A4099;--periwinkle:#7492D5;--periwinkle-lt:#A8BDE8;--periwinkle-bg:#EEF3FB;--sky-bg:#F4F7FD;--warm-white:#fff;--charcoal:#1A2340;--gray-dark:#3D4A6B;--gray-mid:#7A87A8;--gray-light:#BDC6DC;--gray-bg:#EDF0F7;--beige:#E3E8F4;--beige-dark:#C8D1E8;--present:#2E9E6B;--late:#E8A020;--absent:#E04040;--pending:#8A96B2;--mustard:var(--periwinkle);--mustard-lt:var(--periwinkle-lt);--mustard-bg:var(--periwinkle-bg);--orange:var(--navy);--orange-lt:var(--navy-lt);--orange-dark:var(--navy-dark);--cream:var(--sky-bg);--shadow-sm:0 1px 4px rgba(30,50,120,.08);--shadow-md:0 4px 16px rgba(30,50,120,.12);--shadow-lg:0 8px 32px rgba(30,50,120,.16);--radius-sm:8px;--radius-md:16px;--radius-lg:24px;--radius-xl:32px;--radius-full:9999px;--font-kr:'Noto Sans KR',-apple-system,sans-serif;--font-en:'Nunito',sans-serif;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{font-family:var(--font-kr);background:var(--sky-bg);color:var(--charcoal);min-height:100vh;-webkit-font-smoothing:antialiased;}
    .app-wrapper{max-width:430px;min-height:100vh;margin:0 auto;background:var(--sky-bg);position:relative;overflow-x:hidden;}

  </style>
</head>
<body>
<div class="app-wrapper">
  <!-- App Bar -->
  <header class="app-bar">
    <div class="app-bar-left">
      <span class="app-bar-title">Master Track</span>
    </div>
    <div class="app-bar-right">
      <button class="icon-btn" onclick="window.location.href='notices.html'" id="notiBtn" style="position:relative;">🔔<span id="notiDot" style="display:none;position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:#E04040;border:1.5px solid #fff;"></span></button>
      <button class="icon-btn" onclick="showMyPage()">👤</button>
    </div>
  </header>

  <!-- Greeting -->
  <div class="greeting-section">
    <div class="greeting-name" id="greetName">안녕하세요 👋</div>
    <div class="greeting-sub">오늘도 열심히 해봐요!</div>
  </div>

  <div class="page-content" style="padding-top:12px;">


    <!-- Homework -->
    <div class="section-header">
      <div class="section-title">📖 이번 숙제</div>
      <a href="homework.html" class="section-more">전체보기</a>
    </div>
    <div id="hwList" style="display:flex;flex-direction:column;gap:10px;margin-bottom:4px;"></div>

    <!-- 미읽음 공지 배너 -->
    <div id="unreadNoticeBanner" style="display:none;margin-bottom:16px;">
      <button onclick="window.location.href='notices.html'" style="width:100%;background:linear-gradient(135deg,#EEF3FB,#E8EDF8);border:1.5px solid var(--periwinkle-lt);border-radius:var(--radius-md);padding:14px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;text-align:left;">
        <span style="font-size:22px;">🔔</span>
        <div>
          <div style="font-size:13px;font-weight:700;color:var(--navy);">읽지 않은 공지사항이 있습니다</div>
          <div style="font-size:11px;color:var(--gray-mid);margin-top:2px;">탭하여 확인하기</div>
        </div>
        <span style="margin-left:auto;font-size:16px;color:var(--periwinkle);">›</span>
      </button>
    </div>

  </div>

  <!-- Tab Bar -->
  <nav class="tab-bar" id="tabBar"></nav>
</div>

<!-- My Page Modal -->
<div id="myModal" class="modal-overlay hidden">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">MY</div>
    <div id="myPageContent"></div>
    <button class="btn btn-ghost btn-full mt-12" onclick="document.getElementById('myModal').classList.add('hidden')">닫기</button>
  </div>
</div>

<script>(function(){var h=location.href.split('?')[0].split('#')[0],b=h.substring(0,h.lastIndexOf('/')+1);if(!document.querySelector('base')){var e=document.createElement('base');e.href=b;document.head.insertBefore(e,document.head.firstChild);}window._ymsGo=function(p){location.href=b+p;};})()</script>
<script src="js/app.js"></script>
<script>
  const user = ymsPageInit(true);
  let _stuProfile  = null; // tables/students 내 본인 레코드
  let _stuHomework = [];   // 내 반 숙제 목록

  async function init() {
    if (!user) return;
    ymsRenderTabBar('student-home.html');
    document.getElementById('greetName').textContent = `${user.name} 학생, 안녕하세요 👋`;

    // ── 0. 공지 미읽음 뱃지
    checkUnreadNotices();

    // ── 1. 학생 프로필 조회 (className, grade 등)
    try {
      const sid = user.studentId || user._tableId;
      if (sid) {
        const r = await _tFetch(`tables/students/${sid}`);
        if (r.ok) _stuProfile = await r.json();
      }
      if (!_stuProfile) {
        // studentId 없으면 name으로 검색
        const r2 = await _tFetch(`tables/students?search=${encodeURIComponent(user.name)}&limit=5`);
        if (r2.ok) {
          const j = await r2.json();
          _stuProfile = (j.data||[]).find(s => s.name === user.name) || null;
        }
      }
    } catch(e) { console.warn('[YMS] 학생 프로필 조회 실패', e); }

    const myClassName = _stuProfile?.className || '';

    // ── 2. 숙제 조회 (내 반 필터)
    try {
      const r = await _tFetch('tables/homework?limit=50');
      if (r.ok) {
        const j = await r.json();
        let list = j.data || [];
        if (myClassName) list = list.filter(h => h.className === myClassName);
        _stuHomework = list.filter(h => {
          if (!h.dueAt) return true;
          return (new Date(h.dueAt) - Date.now()) > -86400000 * 1; // 1일 지난 것 제외
        });
      }
    } catch(e) { console.warn('[YMS] 숙제 조회 실패', e); }

    // ── 3. 렌더
    // 숙제 목록
    const hwEl = document.getElementById('hwList');
    hwEl.innerHTML = '';
    if (_stuHomework.length === 0) {
      hwEl.innerHTML = `<div style="text-align:center;padding:24px;color:var(--gray-mid);font-size:13px;">📭 등록된 숙제가 없습니다</div>`;
    } else {
      _stuHomework.slice(0, 5).forEach(h => {
        const due = h.dueAt ? new Date(h.dueAt) : null;
        const diff = due ? Math.ceil((due - Date.now()) / 86400000) : null;
        const badge = diff === null ? 'NEW' : diff < 0 ? '기한초과' : diff === 0 ? '오늘마감' : `D-${diff}`;
        const badgeColor = diff === null ? '#7492D5' : diff < 0 ? '#E04040' : diff <= 1 ? '#E8A020' : '#2E9E6B';
        const card = document.createElement('div');
        card.style.cssText = 'background:#fff;border:1px solid var(--beige);border-radius:14px;padding:14px 16px;cursor:pointer;';
        card.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
            <div style="flex:1;min-width:0;">
              <div style="font-size:14px;font-weight:700;color:var(--charcoal);margin-bottom:4px;">${h.title||'(제목 없음)'}</div>
              <div style="font-size:12px;color:var(--gray-mid);">${h.className||''} ${h.teacherName ? '· '+h.teacherName+' 선생님' : ''}</div>
              ${h.content ? `<div style="font-size:12px;color:var(--charcoal);margin-top:6px;line-height:1.5;white-space:pre-wrap;">${h.content}</div>` : ''}
            </div>
            <span style="flex-shrink:0;background:${badgeColor}15;color:${badgeColor};border:1px solid ${badgeColor}40;border-radius:9999px;font-size:11px;font-weight:700;padding:3px 10px;">${badge}</span>
          </div>
          ${due ? `<div style="font-size:11px;color:var(--gray-mid);margin-top:8px;">📅 마감: ${due.toLocaleDateString('ko-KR',{month:'long',day:'numeric'})}</div>` : ''}`;
        hwEl.appendChild(card);
      });
    }
  }

  /* ── 공지 미읽음 뱃지 체크 ───────────────────────────────
     localStorage yms_read_notices 와 DB 공지 목록을 비교하여
     미읽음이 있으면 🔔 버튼·탭 아이콘에 빨간 점 표시         */
  async function checkUnreadNotices() {
    try {
      const r = await _tFetch('tables/notices?limit=100');
      if (!r.ok) return;
      const json = await r.json();
      let list = (json.data || []).filter(n => n.isActive !== false);

      // 학생 소속 반 기준 필터 (이미 _stuProfile 조회 후에 호출되어도 되지만,
      // init() 선두에서 호출하므로 className은 나중에 채워질 수 있음 — 전체 공지 기준)
      const myClass = _stuProfile?.className || '';
      if (myClass) {
        list = list.filter(n => n.targetType === 'ALL' || n.targetClassName === myClass);
      } else {
        list = list.filter(n => n.targetType === 'ALL');
      }

      const readSet = (() => {
        try { return new Set(JSON.parse(localStorage.getItem('yms_read_notices') || '[]')); }
        catch { return new Set(); }
      })();

      const hasUnread = list.some(n => !readSet.has(n.id));
      const dotEl      = document.getElementById('notiDot');
      const tabDotEl   = document.getElementById('tabNotiDot');
      const bannerEl   = document.getElementById('unreadNoticeBanner');
      if (hasUnread) {
        if (dotEl)    dotEl.style.display    = 'block';
        if (tabDotEl) tabDotEl.style.display = 'block';
        if (bannerEl) bannerEl.style.display = 'block';
      }
    } catch(e) { /* silent */ }
  }

  function showMyPage() {
    document.getElementById('myPageContent').innerHTML = `
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:4px;">
        <button class="btn btn-ghost btn-full" style="color:var(--absent);" onclick="YMS_Auth.logout()">🚪 로그아웃</button>
      </div>`;
    document.getElementById('myModal').classList.remove('hidden');
  }

  document.getElementById('myModal').addEventListener('click', function(e) {
    if (e.target === this) this.classList.add('hidden');
  });

  init();
</script>
</body>
</html>
