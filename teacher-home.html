<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>선생님 홈 · YMS Master Track</title>
  <meta name="theme-color" content="#1E3278">
  <link rel="stylesheet" href="css/style.css">
  <style>
    :root {
      --teacher-page-max: 1180px;
    }

    body {
      background:
        radial-gradient(circle at 8% 8%, rgba(116,146,213,.10), transparent 24%),
        var(--sky-bg);
    }

    .teacher-page {
      min-height: 100vh;
    }

    .teacher-topbar {
      height: 70px;
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 max(24px, calc((100vw - var(--teacher-page-max)) / 2));
      background: rgba(255,255,255,.94);
      border-bottom: 1px solid var(--beige);
      backdrop-filter: blur(16px);
    }

    .teacher-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .teacher-brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: -.2px;
      background: linear-gradient(145deg, var(--navy-dark), #334DB8);
      box-shadow: 0 6px 16px rgba(30,50,120,.20);
    }

    .teacher-brand-title {
      font-size: 16px;
      font-weight: 850;
      color: var(--navy-dark);
      line-height: 1.2;
    }

    .teacher-brand-sub {
      margin-top: 2px;
      color: var(--gray-mid);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .4px;
      text-transform: uppercase;
    }

    .teacher-top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .teacher-icon-btn,
    .teacher-top-btn {
      min-height: 38px;
      border: 1px solid var(--beige);
      border-radius: 11px;
      background: #fff;
      color: var(--gray-dark);
      font: inherit;
      font-size: 12px;
      font-weight: 750;
      cursor: pointer;
      transition: .15s ease;
    }

    .teacher-icon-btn {
      width: 38px;
      padding: 0;
      display: grid;
      place-items: center;
      font-size: 16px;
    }

    .teacher-top-btn {
      padding: 0 13px;
    }

    .teacher-icon-btn:hover,
    .teacher-top-btn:hover {
      border-color: var(--periwinkle-lt);
      background: var(--periwinkle-bg);
      color: var(--navy);
    }

    .teacher-main {
      width: min(calc(100% - 40px), var(--teacher-page-max));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .teacher-hero {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 24px;
      min-height: 176px;
      padding: 30px 34px;
      border-radius: 24px;
      color: #fff;
      background: linear-gradient(135deg, #14245A 0%, #1E3278 56%, #4058CA 100%);
      box-shadow: 0 16px 38px rgba(30,50,120,.18);
    }

    .teacher-hero::before,
    .teacher-hero::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .teacher-hero::before {
      width: 230px;
      height: 230px;
      right: -80px;
      top: -120px;
      background: rgba(255,255,255,.06);
    }

    .teacher-hero::after {
      width: 180px;
      height: 180px;
      left: 40%;
      bottom: -145px;
      border: 38px solid rgba(116,146,213,.16);
    }

    .teacher-hero-copy,
    .teacher-hero-date {
      position: relative;
      z-index: 1;
    }

    .teacher-hero-eyebrow {
      margin-bottom: 7px;
      color: rgba(255,255,255,.65);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .8px;
      text-transform: uppercase;
    }

    .teacher-hero h1 {
      margin: 0;
      font-size: clamp(24px, 3.2vw, 34px);
      line-height: 1.2;
      letter-spacing: -.8px;
    }

    .teacher-hero p {
      margin: 9px 0 0;
      color: rgba(255,255,255,.76);
      font-size: 13px;
      line-height: 1.65;
    }

    .teacher-hero-date {
      min-width: 138px;
      padding: 16px 18px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 18px;
      background: rgba(255,255,255,.10);
      text-align: center;
      backdrop-filter: blur(8px);
    }

    .teacher-hero-date .month-day {
      font-size: 22px;
      font-weight: 900;
      line-height: 1.1;
    }

    .teacher-hero-date .weekday {
      margin-top: 6px;
      color: rgba(255,255,255,.72);
      font-size: 11px;
      font-weight: 700;
    }

    .teacher-summary-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin: 18px 0 26px;
    }

    .teacher-summary-card {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      padding: 17px 18px;
      border: 1px solid var(--beige);
      border-radius: 18px;
      background: #fff;
      box-shadow: var(--shadow-sm);
    }

    .teacher-summary-icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 13px;
      background: var(--periwinkle-bg);
      color: var(--navy);
      font-size: 19px;
    }

    .teacher-summary-label {
      color: var(--gray-mid);
      font-size: 11px;
      font-weight: 700;
    }

    .teacher-summary-value {
      margin-top: 2px;
      color: var(--charcoal);
      font-size: 21px;
      font-weight: 900;
      line-height: 1.2;
    }

    .teacher-quick-nav {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 28px;
    }

    .teacher-quick-link {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 50px;
      padding: 0 14px;
      border: 1px solid var(--beige);
      border-radius: 14px;
      background: #fff;
      color: var(--gray-dark);
      text-decoration: none;
      font-size: 12px;
      font-weight: 800;
      box-shadow: var(--shadow-sm);
      transition: .15s ease;
    }

    .teacher-quick-link:hover {
      transform: translateY(-1px);
      border-color: var(--periwinkle-lt);
      color: var(--navy);
      box-shadow: var(--shadow-md);
    }

    .teacher-section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 14px;
    }

    .teacher-section-title {
      font-size: 19px;
      font-weight: 900;
      letter-spacing: -.4px;
      color: var(--charcoal);
    }

    .teacher-section-desc {
      margin-top: 4px;
      color: var(--gray-mid);
      font-size: 11px;
    }

    .teacher-section-count {
      padding: 6px 10px;
      border-radius: 9999px;
      background: var(--periwinkle-bg);
      color: var(--navy);
      font-size: 11px;
      font-weight: 800;
    }

    .teacher-class-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .class-card {
      min-width: 0;
      padding: 20px;
      border: 1px solid var(--beige);
      border-radius: 19px;
      background: #fff;
      box-shadow: var(--shadow-sm);
      transition: .15s ease;
    }

    .class-card:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .class-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    .class-card-main {
      min-width: 0;
    }

    .class-name {
      overflow: hidden;
      color: var(--charcoal);
      font-size: 17px;
      font-weight: 900;
      letter-spacing: -.3px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .class-meta {
      margin-top: 6px;
      color: var(--gray-mid);
      font-size: 11px;
      line-height: 1.55;
    }

    .class-time-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex: 0 0 auto;
      padding: 5px 10px;
      border: 1px solid var(--periwinkle-lt);
      border-radius: 9999px;
      background: var(--periwinkle-bg);
      color: var(--navy);
      font-size: 10px;
      font-weight: 850;
      white-space: nowrap;
    }

    .class-info-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 8px;
      margin-top: 16px;
    }

    .class-info-chip {
      padding: 9px 10px;
      border-radius: 12px;
      background: #F7F9FD;
      color: var(--gray-dark);
      font-size: 11px;
      line-height: 1.35;
    }

    .class-info-chip strong {
      color: var(--charcoal);
      font-size: 12px;
    }

    .class-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }

    .class-actions .btn {
      width: 100%;
      min-height: 42px;
      border-radius: 12px;
      font-size: 12px;
    }

    .teacher-empty {
      grid-column: 1 / -1;
      padding: 52px 24px;
      border: 1px dashed var(--beige-dark);
      border-radius: 18px;
      background: rgba(255,255,255,.72);
      text-align: center;
      color: var(--gray-mid);
      font-size: 13px;
    }

    .teacher-empty-icon {
      margin-bottom: 10px;
      font-size: 30px;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(14,23,52,.44);
      backdrop-filter: blur(3px);
    }

    .modal-overlay.hidden { display: none !important; }

    .modal-sheet {
      width: min(100%, 520px);
      max-height: min(88vh, 760px);
      overflow-y: auto;
      padding: 24px;
      border: 1px solid var(--beige);
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 24px 70px rgba(20,36,90,.24);
    }

    .modal-handle {
      display: none;
    }

    .modal-title {
      margin-bottom: 18px;
      color: var(--charcoal);
      font-size: 19px;
      font-weight: 900;
      letter-spacing: -.3px;
    }

    .hw-register-form {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .att-student-row {
      display: grid;
      grid-template-columns: 38px minmax(100px,1fr) auto;
      align-items: center;
      gap: 11px;
      padding: 11px 0;
      border-bottom: 1px solid var(--beige);
    }

    .att-student-row:last-child { border-bottom: 0; }

    .att-avatar {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--periwinkle-bg);
      color: var(--navy);
      font-size: 13px;
      font-weight: 850;
    }

    .att-student-name {
      min-width: 0;
      color: var(--charcoal);
      font-size: 13px;
      font-weight: 750;
    }

    .att-toggle-group {
      display: flex;
      gap: 5px;
    }

    .att-toggle {
      min-height: 31px;
      padding: 0 9px;
      border: 1px solid var(--beige-dark);
      border-radius: 9px;
      background: #fff;
      color: var(--gray-mid);
      font: inherit;
      font-size: 10px;
      font-weight: 800;
      cursor: pointer;
    }

    .att-toggle.present.active { background: #E8F7EF; border-color: #91D1AE; color: #23774F; }
    .att-toggle.late.active { background: #FFF7E5; border-color: #F0C46B; color: #A86C00; }
    .att-toggle.absent.active { background: #FFF0F0; border-color: #F0A5A5; color: #C73535; }

    .loading-card {
      height: 176px;
      border: 1px solid var(--beige);
      border-radius: 18px;
      background: linear-gradient(90deg,#F4F6FB 25%,#EBEFF7 37%,#F4F6FB 63%);
      background-size: 400% 100%;
      animation: teacherLoading 1.2s ease infinite;
    }

    @keyframes teacherLoading {
      0% { background-position: 100% 50%; }
      100% { background-position: 0 50%; }
    }

    @media (max-width: 820px) {
      .teacher-main {
        width: min(calc(100% - 28px), var(--teacher-page-max));
        padding-top: 18px;
      }

      .teacher-topbar {
        height: 62px;
        padding: 0 14px;
      }

      .teacher-brand-sub,
      .teacher-top-btn .desktop-label {
        display: none;
      }

      .teacher-hero {
        grid-template-columns: 1fr;
        min-height: 0;
        padding: 24px 22px;
        border-radius: 20px;
      }

      .teacher-hero-date {
        min-width: 0;
        width: fit-content;
        padding: 10px 13px;
        text-align: left;
      }

      .teacher-hero-date .month-day {
        display: inline;
        font-size: 15px;
      }

      .teacher-hero-date .weekday {
        display: inline;
        margin: 0 0 0 6px;
        font-size: 10px;
      }

      .teacher-summary-grid {
        grid-template-columns: 1fr 1fr;
      }

      .teacher-summary-card:last-child {
        grid-column: 1 / -1;
      }

      .teacher-quick-nav {
        grid-template-columns: 1fr 1fr;
      }

      .teacher-class-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 520px) {
      .teacher-top-actions .teacher-top-btn.admin-link {
        display: none;
      }

      .teacher-brand-title {
        font-size: 14px;
      }

      .teacher-main {
        width: calc(100% - 24px);
      }

      .teacher-hero h1 {
        font-size: 24px;
      }

      .teacher-summary-grid {
        gap: 8px;
        margin-bottom: 18px;
      }

      .teacher-summary-card {
        padding: 13px;
        border-radius: 15px;
      }

      .teacher-summary-icon {
        width: 36px;
        height: 36px;
        border-radius: 11px;
        font-size: 16px;
      }

      .teacher-summary-value {
        font-size: 18px;
      }

      .teacher-quick-nav {
        gap: 8px;
        margin-bottom: 22px;
      }

      .teacher-quick-link {
        min-height: 46px;
        padding: 0 11px;
      }

      .class-card {
        padding: 17px;
      }

      .class-card-header {
        display: block;
      }

      .class-time-badge {
        margin-top: 10px;
      }

      .att-student-row {
        grid-template-columns: 36px 1fr;
      }

      .att-toggle-group {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: repeat(3,1fr);
      }

      .modal-overlay {
        align-items: flex-end;
        padding: 0;
      }

      .modal-sheet {
        width: 100%;
        max-height: 92vh;
        padding: 18px 18px calc(20px + env(safe-area-inset-bottom));
        border-radius: 22px 22px 0 0;
      }

      .modal-handle {
        display: block;
        width: 42px;
        height: 4px;
        margin: 0 auto 15px;
        border-radius: 9999px;
        background: var(--beige-dark);
      }
    }
  </style>
</head>
<body>
<div class="teacher-page">
  <header class="teacher-topbar">
    <div class="teacher-brand">
      <div class="teacher-brand-mark">YMS</div>
      <div>
        <div class="teacher-brand-title">YMS Master Track</div>
        <div class="teacher-brand-sub">Teacher Dashboard</div>
      </div>
    </div>

    <div class="teacher-top-actions">
      <button class="teacher-icon-btn" type="button" title="내 정보" onclick="showMyPage()">👤</button>
      <button class="teacher-top-btn admin-link" id="adminShortcut" type="button" style="display:none;" onclick="_ymsGo('admin.html')">관리자 화면</button>
      <button class="teacher-top-btn" type="button" onclick="YMS_Auth.logout()"><span class="desktop-label">로그아웃</span><span aria-hidden="true"> 🚪</span></button>
    </div>
  </header>

  <main class="teacher-main">
    <section class="teacher-hero">
      <div class="teacher-hero-copy">
        <div class="teacher-hero-eyebrow">Today at YMS</div>
        <h1 id="greetName">선생님, 안녕하세요 👋</h1>
        <p id="greetSub">오늘 수업 일정과 학생 현황을 한눈에 확인하세요.</p>
      </div>
      <div class="teacher-hero-date">
        <div class="month-day" id="todayMonthDay">-</div>
        <div class="weekday" id="todayWeekday">-</div>
      </div>
    </section>

    <section class="teacher-summary-grid" aria-label="오늘 요약">
      <div class="teacher-summary-card">
        <div class="teacher-summary-icon">📚</div>
        <div>
          <div class="teacher-summary-label">담당 수업</div>
          <div class="teacher-summary-value" id="summaryClasses">-</div>
        </div>
      </div>
      <div class="teacher-summary-card">
        <div class="teacher-summary-icon">👨‍🎓</div>
        <div>
          <div class="teacher-summary-label">담당 학생</div>
          <div class="teacher-summary-value" id="summaryStudents">-</div>
        </div>
      </div>
      <div class="teacher-summary-card">
        <div class="teacher-summary-icon">✅</div>
        <div>
          <div class="teacher-summary-label">오늘 할 일</div>
          <div class="teacher-summary-value" id="summaryTasks">수업 확인</div>
        </div>
      </div>
    </section>

    <nav class="teacher-quick-nav" aria-label="빠른 메뉴">
      <a class="teacher-quick-link" href="attendance.html"><span>✅</span><span>출결 현황</span></a>
      <a class="teacher-quick-link" href="homework.html"><span>📖</span><span>숙제 관리</span></a>
      <a class="teacher-quick-link" href="calendar.html"><span>📅</span><span>캘린더</span></a>
      <a class="teacher-quick-link" href="counseling.html"><span>💬</span><span>상담 관리</span></a>
    </nav>

    <section>
      <div class="teacher-section-head">
        <div>
          <div class="teacher-section-title">오늘 수업</div>
          <div class="teacher-section-desc">담당 반별로 출결과 숙제를 바로 입력할 수 있어요.</div>
        </div>
        <div class="teacher-section-count" id="todayClassCount">불러오는 중</div>
      </div>

      <div class="teacher-class-grid" id="todayClassList">
        <div class="loading-card"></div>
        <div class="loading-card"></div>
      </div>
    </section>
  </main>
</div>

<div id="hwRegModal" class="modal-overlay hidden">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">✏️ 숙제 등록</div>
    <form class="hw-register-form" id="hwRegForm" onsubmit="submitHomework(event)">
      <input type="hidden" id="hwClassId">
      <div class="form-group" style="margin-bottom:0;">
        <label class="form-label" for="hwTitle">숙제 제목</label>
        <input type="text" class="form-input" id="hwTitle" placeholder="예) Unit 5 단어 암기 10개" required>
      </div>
      <div class="form-group" style="margin-bottom:0;">
        <label class="form-label" for="hwContent">내용</label>
        <textarea class="form-input" id="hwContent" rows="3" placeholder="숙제 내용을 입력하세요" style="resize:vertical;"></textarea>
      </div>
      <div class="form-group" style="margin-bottom:0;">
        <label class="form-label" for="hwDueDate">마감일</label>
        <input type="date" class="form-input" id="hwDueDate">
      </div>
      <div style="display:flex;gap:8px;margin-top:4px;">
        <button type="button" class="btn btn-ghost" style="flex:1;" onclick="closeHwRegModal()">취소</button>
        <button type="submit" class="btn btn-primary" style="flex:2;" id="hwRegSubmitBtn">등록하기</button>
      </div>
    </form>
  </div>
</div>

<div id="attModal" class="modal-overlay hidden">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">✅ 출결 입력</div>
    <div id="attModalClassLabel" style="font-size:12px;color:var(--gray-mid);margin:-8px 0 14px;"></div>
    <div id="attStudentList"></div>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button type="button" class="btn btn-ghost" style="flex:1;" onclick="closeAttModal()">취소</button>
      <button type="button" class="btn btn-primary" style="flex:2;" onclick="submitAttendance()">저장하기</button>
    </div>
  </div>
</div>

<div id="myModal" class="modal-overlay hidden">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">내 정보</div>
    <div id="myPageContent"></div>
    <button class="btn btn-ghost btn-full" style="margin-top:12px;" onclick="document.getElementById('myModal').classList.add('hidden')">닫기</button>
  </div>
</div>

<script>
  (function(){
    const h=location.href.split('?')[0].split('#')[0];
    const b=h.substring(0,h.lastIndexOf('/')+1);
    window._ymsGo=function(p){ location.href=b+p; };
  })();
</script>
<script src="js/app.js"></script>
<script>
  const user = ymsPageInit(true);
  if (user && user.role !== 'TEACHER' && user.role !== 'ADMIN') {
    _ymsGo('login.html');
  }

  let attStatus = {};
  let currentClassId = null;
  let _myClasses = [];
  let _myStudents = [];

  function safeText(v, fallback='-') {
    const s = String(v ?? '').trim();
    return s || fallback;
  }

  function escapeHtml(value) {
    return String(value ?? '')
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#39;');
  }

  function formatClassTime(cls) {
    const start = String(cls.startTime || '').trim();
    const end = String(cls.endTime || '').trim();
    if (start && end) return `${start}–${end}`;
    if (start) return start;
    return '시간 미정';
  }

  function init() {
    if (!user) return;

    const isAdmin = user.role === 'ADMIN';
    document.getElementById('adminShortcut').style.display = isAdmin ? '' : 'none';
    document.getElementById('greetName').textContent = isAdmin
      ? `${user.name || '관리자'} 관리자님, 안녕하세요 👋`
      : `${user.name || '선생님'} 선생님, 안녕하세요 👋`;
    document.getElementById('greetSub').textContent = isAdmin
      ? '관리자 권한으로 선생님 수업 화면을 확인하고 있어요.'
      : '오늘 수업 일정과 학생 현황을 한눈에 확인하세요.';

    const today = new Date();
    document.getElementById('todayMonthDay').textContent = `${today.getMonth()+1}월 ${today.getDate()}일`;
    document.getElementById('todayWeekday').textContent = `${['일요일','월요일','화요일','수요일','목요일','금요일','토요일'][today.getDay()]}`;

    loadTeacherDashboard();
  }

  async function loadTeacherDashboard() {
    try {
      const [classRes, studentRes] = await Promise.all([
        _tFetch('tables/classes?limit=200'),
        _tFetch('tables/students?limit=500')
      ]);

      const classJson = classRes.ok ? await classRes.json() : {data:[]};
      const studentJson = studentRes.ok ? await studentRes.json() : {data:[]};
      const allClasses = classJson.data || [];
      const allStudents = studentJson.data || [];

      if (user.role === 'TEACHER') {
        const assigned = Array.isArray(user.teacherClasses)
          ? user.teacherClasses
          : String(user.teacherClasses || '').split(',').map(v=>v.trim()).filter(Boolean);

        _myClasses = allClasses.filter(c =>
          c.teacherId === user.id ||
          c.teacherName === user.name ||
          assigned.includes(c.id) ||
          assigned.includes(c.className)
        );
      } else {
        _myClasses = allClasses;
      }

      const classIds = new Set(_myClasses.map(c=>c.id).filter(Boolean));
      const classNames = new Set(_myClasses.map(c=>c.className).filter(Boolean));
      _myStudents = allStudents.filter(s => classIds.has(s.classId) || classNames.has(s.className));
    } catch(e) {
      console.error('[YMS] 선생님 대시보드 로드 실패', e);
      _myClasses = [];
      _myStudents = [];
    }

    renderTeacherHome();
  }

  function renderTeacherHome() {
    document.getElementById('summaryClasses').textContent = `${_myClasses.length}개`;
    document.getElementById('summaryStudents').textContent = `${new Set(_myStudents.map(s=>s.id)).size}명`;
    document.getElementById('todayClassCount').textContent = `${_myClasses.length}개 수업`;

    const listEl = document.getElementById('todayClassList');
    if (!_myClasses.length) {
      listEl.innerHTML = `
        <div class="teacher-empty">
          <div class="teacher-empty-icon">📭</div>
          <strong style="color:var(--charcoal);">등록된 담당 수업이 없습니다.</strong>
          <div style="margin-top:6px;">관리자 화면의 반 관리에서 담당 선생님을 지정해주세요.</div>
        </div>`;
      return;
    }

    listEl.innerHTML = _myClasses.map(cls => {
      const students = _myStudents.filter(s =>
        (cls.id && s.classId === cls.id) ||
        (cls.className && s.className === cls.className)
      );
      const studentCount = students.length || Number(cls.studentCount || 0);
      const subject = safeText(cls.subject, '과목 미지정');
      const level = safeText(cls.levelCode, '레벨 미지정');
      const clsId = escapeHtml(cls.id || cls.classId || '');

      return `
        <article class="class-card">
          <div class="class-card-header">
            <div class="class-card-main">
              <div class="class-name">${escapeHtml(safeText(cls.className, '반 이름 없음'))}</div>
              <div class="class-meta">${escapeHtml(subject)} · ${escapeHtml(level)}</div>
            </div>
            <span class="class-time-badge">🕐 ${escapeHtml(formatClassTime(cls))}</span>
          </div>

          <div class="class-info-row">
            <div class="class-info-chip">학생<br><strong>${studentCount}명</strong></div>
            <div class="class-info-chip">담당<br><strong>${escapeHtml(safeText(cls.teacherName || user.name, '미지정'))}</strong></div>
          </div>

          <div class="class-actions">
            <button class="btn btn-outline" type="button" onclick="showAttModal('${clsId}')">✅ 출결 입력</button>
            <button class="btn btn-primary" type="button" onclick="showHwRegModal('${clsId}')">✏️ 숙제 등록</button>
          </div>
        </article>`;
    }).join('');
  }

  function showHwRegModal(classId) {
    currentClassId = classId;
    document.getElementById('hwClassId').value = classId || '';
    const tom = new Date();
    tom.setDate(tom.getDate() + 1);
    document.getElementById('hwDueDate').value = tom.toISOString().slice(0,10);
    document.getElementById('hwRegModal').classList.remove('hidden');
  }

  function closeHwRegModal() {
    document.getElementById('hwRegModal').classList.add('hidden');
    document.getElementById('hwRegForm').reset();
  }

  async function submitHomework(e) {
    e.preventDefault();
    const btn = document.getElementById('hwRegSubmitBtn');
    btn.disabled = true;
    btn.textContent = '등록 중...';

    const cls = _myClasses.find(c => c.id === currentClassId || c.classId === currentClassId);
    const due = document.getElementById('hwDueDate').value;
    const payload = {
      classId: currentClassId || '',
      className: cls?.className || '',
      subject: cls?.subject || '',
      teacherId: user?.id || '',
      teacherName: user?.name || '',
      title: document.getElementById('hwTitle').value.trim(),
      content: document.getElementById('hwContent').value.trim(),
      dueAt: due ? new Date(due + 'T21:00:00+09:00').toISOString() : null,
      isVisible: true
    };

    try {
      const res = await _tFetch('tables/homework', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(payload)
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      closeHwRegModal();
      YMS_UI.toast('숙제가 등록되었습니다! 📚');
    } catch(err) {
      console.error('[YMS] 숙제 등록 실패', err);
      YMS_UI.toast('❌ 등록 실패: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = '등록하기';
    }
  }

  async function showAttModal(classId) {
    currentClassId = classId;
    const cls = _myClasses.find(c => c.id === classId || c.classId === classId) || _myClasses[0];
    document.getElementById('attModalClassLabel').textContent = `📋 ${cls?.className || '반'} 학생 출결`;

    const listEl = document.getElementById('attStudentList');
    listEl.innerHTML = '<div style="text-align:center;padding:18px;color:var(--gray-mid);font-size:12px;">학생 목록 불러오는 중...</div>';
    attStatus = {};
    document.getElementById('attModal').classList.remove('hidden');

    let students = _myStudents.filter(s =>
      (cls?.id && s.classId === cls.id) ||
      (cls?.className && s.className === cls.className)
    );

    if (!students.length) {
      try {
        const stuRes = await _tFetch('tables/students?limit=500');
        const stuJson = stuRes.ok ? await stuRes.json() : {data:[]};
        students = (stuJson.data || []).filter(s =>
          (cls?.id && s.classId === cls.id) ||
          (cls?.className && s.className === cls.className)
        );
      } catch(e) {}
    }

    if (!students.length) {
      listEl.innerHTML = '<div class="teacher-empty" style="padding:30px 16px;">이 반에 등록된 학생이 없습니다.</div>';
      return;
    }

    listEl.innerHTML = '';
    students.forEach(s => {
      attStatus[s.id] = 'PRESENT';
      const row = document.createElement('div');
      row.className = 'att-student-row';
      row.dataset.studentId = s.id;
      row.dataset.studentName = s.name || '';
      row.innerHTML = `
        <div class="att-avatar">${escapeHtml((s.name || '?')[0])}</div>
        <div class="att-student-name">${escapeHtml(s.name || '-')} <small style="color:var(--gray-mid);font-weight:600;">${escapeHtml(s.grade || '')}</small></div>
        <div class="att-toggle-group">
          <button type="button" class="att-toggle present active" data-status="PRESENT" onclick="setAtt(this,'${escapeHtml(s.id)}','PRESENT')">출석</button>
          <button type="button" class="att-toggle late" data-status="LATE" onclick="setAtt(this,'${escapeHtml(s.id)}','LATE')">지각</button>
          <button type="button" class="att-toggle absent" data-status="ABSENT" onclick="setAtt(this,'${escapeHtml(s.id)}','ABSENT')">결석</button>
        </div>`;
      listEl.appendChild(row);
    });
  }

  function setAtt(btn, studentId, status) {
    attStatus[studentId] = status;
    const group = btn.closest('.att-toggle-group');
    group.querySelectorAll('.att-toggle').forEach(b => b.classList.toggle('active', b.dataset.status === status));
  }

  function closeAttModal() {
    document.getElementById('attModal').classList.add('hidden');
  }

  async function submitAttendance() {
    const saveBtn = document.querySelector('#attModal .btn-primary');
    if (saveBtn) {
      saveBtn.disabled = true;
      saveBtn.textContent = '저장 중...';
    }

    const today = new Date().toISOString().slice(0,10);
    const cls = _myClasses.find(c => c.id === currentClassId || c.classId === currentClassId) || _myClasses[0];
    const rows = Array.from(document.querySelectorAll('#attStudentList .att-student-row'));

    let existingMap = {};
    try {
      const exRes = await _tFetch('tables/attendance?limit=500');
      if (exRes.ok) {
        const exJson = await exRes.json();
        (exJson.data || []).forEach(r => {
          if (r.date === today && r.className === cls?.className) existingMap[r.studentId] = r.id;
        });
      }
    } catch(e) {}

    let successCount = 0;
    const errors = [];

    for (const row of rows) {
      const studentId = row.dataset.studentId;
      const studentName = row.dataset.studentName || '';
      const status = attStatus[studentId] || 'PRESENT';
      const existingId = existingMap[studentId];

      try {
        const res = existingId
          ? await _tFetch(`tables/attendance/${existingId}`, {
              method:'PATCH',
              headers:{'Content-Type':'application/json'},
              body:JSON.stringify({status})
            })
          : await _tFetch('tables/attendance', {
              method:'POST',
              headers:{'Content-Type':'application/json'},
              body:JSON.stringify({
                studentId,
                studentName,
                classId: cls?.id || currentClassId || '',
                className: cls?.className || '',
                date: today,
                status,
                teacherId: user.id,
                teacherName: user.name || '',
                memo: ''
              })
            });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        successCount++;
      } catch(e) {
        errors.push(studentName || studentId);
      }
    }

    if (saveBtn) {
      saveBtn.disabled = false;
      saveBtn.textContent = '저장하기';
    }

    closeAttModal();
    YMS_UI.toast(errors.length
      ? `⚠️ 일부 저장 실패: ${errors.join(', ')}`
      : `✅ ${successCount}명 출결이 저장되었습니다!`);
  }

  function showMyPage() {
    const content = document.getElementById('myPageContent');
    const roleLabel = user?.role === 'ADMIN' ? '관리자' : '선생님';
    content.innerHTML = `
      <div style="display:flex;align-items:center;gap:14px;padding:4px 0 18px;">
        <div style="width:52px;height:52px;border-radius:16px;background:var(--periwinkle-bg);color:var(--navy);display:grid;place-items:center;font-size:22px;">👩‍🏫</div>
        <div>
          <div style="font-size:17px;font-weight:900;color:var(--charcoal);">${escapeHtml(user?.name || '-')}</div>
          <div style="margin-top:4px;font-size:11px;color:var(--gray-mid);">${roleLabel} · YMS Master Track</div>
        </div>
      </div>
      <div style="border-top:1px solid var(--beige);padding-top:14px;">
        <div style="display:flex;justify-content:space-between;gap:12px;font-size:12px;padding:6px 0;"><span style="color:var(--gray-mid);">아이디</span><strong>${escapeHtml(user?.loginId || '-')}</strong></div>
        <div style="display:flex;justify-content:space-between;gap:12px;font-size:12px;padding:6px 0;"><span style="color:var(--gray-mid);">권한</span><strong>${roleLabel}</strong></div>
      </div>
      <button class="btn btn-ghost btn-full" style="margin-top:16px;color:var(--absent);" onclick="YMS_Auth.logout()">🚪 로그아웃</button>`;
    document.getElementById('myModal').classList.remove('hidden');
  }

  ['hwRegModal','attModal','myModal'].forEach(id => {
    document.getElementById(id).addEventListener('click', function(e) {
      if (e.target === this) this.classList.add('hidden');
    });
  });

  init();
</script>
</body>
</html>
